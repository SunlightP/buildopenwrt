name: Build OpenWRT 24.10 Firmware

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出 OpenWRT 源码
      - name: Checkout OpenWRT Source
        uses: actions/checkout@v4

      # 2. 安装构建依赖
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
          gettext git libncurses5-dev libssl-dev rsync unzip zlib1g-dev file wget \
          python3 python3-pip python3-venv libssl-dev zlib1g-dev \
          libreadline-dev libyaml-dev libsqlite3-dev sqlite3 \
          libxml2-dev libxslt1-dev libcurl4-openssl-dev \
          software-properties-common libffi-dev ruby-dev

      # 3. 克隆 OpenWRT 24.10 源码
      - name: Clone OpenWRT Repository
        run: |
          git clone --depth=1 https://git.openwrt.org/openwrt/openwrt.git -b openwrt-24.10
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
      
      - name: Fix cache-domains dependency on dnsmasq
        run: |
          sed -i 's/dnsmasq/dnsmasq-full/g' openwrt/package/feeds/packages/cache-domains/Makefile || true

      # 4. 添加 OpenClash 插件
      - name: Add OpenClash Plugin
        run: |
          cd openwrt/package
          git clone --depth=1 https://github.com/vernesong/OpenClash.git openclash

      # 5. 替换 dnsmasq 为 dnsmasq-full
      - name: Replace dnsmasq with dnsmasq-full
        run: |
          cd openwrt
          sed -i 's/dnsmasq/dnsmasq-full/g' package/network/services/dnsmasq/Makefile

      # 6. 配置 OpenWRT
      - name: Configure OpenWRT
        run: |
          cd openwrt
          make defconfig
          echo "CONFIG_TARGET_x86=y" >> .config
          echo "CONFIG_TARGET_x86_64=y" >> .config
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-base-zh-cn=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-opkg-zh-cn=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-upnp=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-openclash=y" >> .config
          echo "CONFIG_PACKAGE_dnsmasq-full=y" >> .config
          echo "CONFIG_TARGET_ROOTFS_SQUASHFS=y" >> .config
          echo "CONFIG_PACKAGE_luci-theme-bootstrap=y" >> .config

      # 7. 设置默认 IP 为 192.168.50.1
      - name: Set Default IP to 192.168.50.1
        run: |
          cd openwrt
          sed -i 's/192.168.1.1/192.168.50.1/g' package/base-files/files/bin/config_generate

      # 8. 设置时区为 Asia/Shanghai 并更换 NTP 服务器
      - name: Set Timezone and NTP Servers
        run: |
          cd openwrt
          sed -i 's/UTC/Asia\/Shanghai/g' package/base-files/files/bin/config_generate
          sed -i 's/0.openwrt.pool.ntp.org/ntp1.aliyun.com/g' package/base-files/files/bin/config_generate
          sed -i 's/1.openwrt.pool.ntp.org/ntp2.aliyun.com/g' package/base-files/files/bin/config_generate
          sed -i 's/2.openwrt.pool.ntp.org/ntp3.aliyun.com/g' package/base-files/files/bin/config_generate

      # 9. 启用 LuCI 中文支持
      - name: Enable LuCI Chinese Language Support
        run: |
          cd openwrt
          echo "CONFIG_PACKAGE_luci-i18n-base-zh-cn=y" >> .config

      # 10. 编译 OpenWRT
      - name: Compile OpenWRT
        run: |
          cd openwrt
          make -j$(nproc) V=s

      # 11. 上传编译固件
      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-firmware
          path: openwrt/bin/targets/
